<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskYard</title>
    <script>
      // Fallback SPA loader for static web hosts
      const p = window.location.pathname;
      if (p && p !== '/' && p !== '/index.html') {
        sessionStorage.setItem('taskyard_route', p + window.location.search + window.location.hash);
        window.location.replace('/');
      }
    </script>
  </head>
  <body style="background:#0b0d14;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;margin:0;">
    <p>Loading TaskYard...</p>
  </body>
</html>
